<!-- Screenshot: Settings / Pro Screen -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 500" width="240" height="500" role="img" aria-label="CredStow Settings — Pro features, biometric lock, encrypted backup">
  <!-- Phone frame -->
  <rect x="2" y="2" width="236" height="496" rx="52" ry="52"
        fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <!-- Screen inset -->
  <rect x="6" y="6" width="228" height="488" rx="46" ry="46"
        fill="#f8fafc"/>
  <!-- Status bar -->
  <circle cx="34" cy="32" r="3.5" fill="#2563eb"/>
  <text x="226" y="36" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">100%</text>
  <!-- Top app bar -->
  <rect x="6" y="52" width="228" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M18 72 l8 8 l-8 8" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="78" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Settings</text>
  <!-- Pro card -->
  <rect x="18" y="108" width="204" height="76" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="26" y="116" width="28" height="28" rx="14" fill="#eff6ff"/>
  <circle cx="40" cy="130" r="8" fill="#2563eb"/>
  <text x="60" y="134" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">CredStow Pro</text>
  <text x="60" y="148" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">One-time purchase · $4.99</text>
  <rect x="170" y="132" width="50" height="22" rx="11" fill="#2563eb"/>
  <text x="195" y="148" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">Upgrade</text>
  <!-- Settings rows -->
  <rect x="18" y="200" width="204" height="44" rx="12" fill="#ffffff" border="#e2e8f0" stroke-width="1"/>
  <rect x="18" y="200" width="204" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="44" cy="224" r="12" fill="#eff6ff"/>
  <text x="64" y="216" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Biometric lock</text>
  <text x="64" y="230" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Require fingerprint or face</text>
  <rect x="172" y="218" width="36" height="20" rx="10" fill="#2563eb" opacity="0.9"/>
  <!-- Row 2 -->
  <rect x="18" y="252" width="204" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="44" cy="276" r="12" fill="#fef3c7"/>
  <text x="64" y="268" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Clipboard auto-clear</text>
  <text x="64" y="282" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">30 seconds</text>
  <!-- Row 3 -->
  <rect x="18" y="304" width="204" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="44" cy="330" r="12" fill="#ede9fe"/>
  <path d="M36 322 l16 16 l16 -16" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="322" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Export backup</text>
  <text x="64" y="338" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">AES-256-GCM · Pro only</text>
  <!-- Row 4 -->
  <rect x="18" y="356" width="204" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="44" cy="380" r="12" fill="#dbeafe"/>
  <path d="M36 372 l16 16 l16 -16" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="372" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Privacy policy</text>
  <path d="M190 380 l8 8 l-8 8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Divider -->
  <line x1="18" y1="408" x2="222" y2="408" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Free tier notice -->
  <text x="120" y="430" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Free · 3 / 3 keys · Ads enabled</text>
</svg>
