<!-- TecMarketa logo: stylized lock icon + wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="TecMarketa logo">
  <defs>
    <linearGradient id="tec-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- Lock icon -->
  <g transform="translate(0,0)">
    <rect x="10" y="38" width="56" height="44" rx="8" fill="url(#tec-grad)" stroke="none"/>
    <!-- shackle -->
    <path d="M20 38a18 18 0 1 1 36 0" fill="url(#tec-grad)"/>
    <!-- key teeth -->
    <circle cx="48" cy="62" r="3" fill="#fff"/>
    <circle cx="48" cy="72" r="3" fill="#fff"/>
  </g>
  <!-- Wordmark -->
  <text x="80" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="700" fill="url(#tec-grad)">TecMarketa</text>
  <text x="80" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="400" fill="#64748b">Secure Apps &amp; Content</text>
</svg>
