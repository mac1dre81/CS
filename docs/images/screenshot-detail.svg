<!-- Screenshot: Key Detail Screen -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 500" width="240" height="500" role="img" aria-label="CredStow key detail — decrypt and copy your API key securely">
  <!-- Phone frame -->
  <rect x="2" y="2" width="236" height="496" rx="52" ry="52"
        fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <!-- Screen inset -->
  <rect x="6" y="6" width="228" height="488" rx="46" ry="46"
        fill="#f8fafc"/>
  <!-- Status bar -->
  <circle cx="34" cy="32" r="3.5" fill="#2563eb"/>
  <text x="226" y="36" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">100%</text>
  <!-- Top app bar -->
  <rect x="6" y="52" width="228" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M18 72 l8 8 l-8 8" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="78" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Work OpenAI</text>
  <circle cx="32" cy="76" r="9" fill="#eff6ff"/>
  <circle cx="32" cy="76" r="4" fill="#2563eb"/>
  <path d="M195 70 l10 12 l-20 0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <path d="M210 70 l-2 4 l-6 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Key status card -->
  <rect x="18" y="108" width="204" height="152" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Provider icon -->
  <circle cx="50" cy="140" r="16" fill="#eff6ff"/>
  <circle cx="50" cy="140" r="7" fill="#2563eb"/>
  <text x="78" y="146" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">OpenAI</text>
  <!-- Status chip -->
  <rect x="160" y="132" width="48" height="22" rx="11" fill="#dcfce7"/>
  <text x="184" y="148" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">Valid</text>
  <!-- Masked key -->
  <rect x="26" y="160" width="188" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="182" font-family="monospace" font-size="12" fill="#0f172a">sk-••••••••••••••••••3xK9</text>
  <!-- Copy button -->
  <rect x="26" y="202" width="188" height="40" rx="10" fill="#2563eb"/>
  <text x="120" y="228" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Copy to clipboard</text>
  <!-- Created date -->
  <text x="26" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Created Oct 12, 2026</text>
  <!-- Action buttons -->
  <rect x="26" y="272" width="204" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="48" cy="294" r="8" fill="#eff6ff"/>
  <text x="62" y="300" font-family="-apple-system, sans-serif" font-size="12.5" fill="#0f172a">Test key</text>
  <text x="194" y="300" font-family="-apple-system, sans-serif" font-size="12.5" fill="#0f172a" text-anchor="end">Edit</text>
  <!-- Delete button -->
  <rect x="26" y="330" width="204" height="44" rx="12" fill="#ffffff" stroke="#fee2e2" stroke-width="1"/>
  <path d="M68 382 l-8 0 l-8 -8 l16 0 M70 384 l-2 2 M68 382 l2 0 M66 384 l2 2" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="370" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#ef4444" text-anchor="middle">Delete</text>
  <!-- Clipboard auto-clear notice -->
  <rect x="26" y="386" width="204" height="24" rx="12" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
  <text x="128" y="403" font-family="-apple-system, sans-serif" font-size="10.5" fill="#92400e" text-anchor="middle">Key copies to clipboard, auto-clears in 30s</text>
</svg>
