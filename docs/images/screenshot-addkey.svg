<!-- Screenshot: Add / Edit Key Screen -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 500" width="240" height="500" role="img" aria-label="CredStow add key — enter provider, label, and API key securely">
  <!-- Phone frame -->
  <rect x="2" y="2" width="236" height="496" rx="52" ry="52"
        fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <!-- Screen inset -->
  <rect x="6" y="6" width="228" height="488" rx="46" ry="46"
        fill="#f8fafc"/>
  <!-- Status bar -->
  <circle cx="34" cy="32" r="3.5" fill="#2563eb"/>
  <text x="226" y="36" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">100%</text>
  <!-- Top app bar -->
  <rect x="6" y="52" width="228" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M18 72 l8 8 l-8 8" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="78" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Add Key</text>
  <text x="212" y="78" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#2563eb" text-anchor="end">Save</text>
  <!-- Provider selector -->
  <rect x="18" y="108" width="204" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="44" cy="132" r="12" fill="#eff6ff"/>
  <circle cx="44" cy="132" r="7" fill="#2563eb"/>
  <text x="64" y="128" font-family="-apple-system, sans-serif" font-size="12.5" fill="#64748b">Provider</text>
  <text x="64" y="142" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#0f172a">OpenAI</text>
  <path d="M184 136 l8 8 l-8 8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label field -->
  <rect x="18" y="166" width="204" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="182" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Label</text>
  <text x="30" y="200" font-family="-apple-system, sans-serif" font-size="13" fill="#0f172a">e.g. Work OpenAI</text>
  <!-- API key field -->
  <rect x="18" y="230" width="204" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="246" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">API key</text>
  <text x="30" y="264" font-family="monospace" font-size="12" fill="#94a3b8">••••••••••••••••••••</text>
  <!-- Notes field -->
  <rect x="18" y="294" width="204" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <text x="30" y="310" font-family="-apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Notes (optional)</text>
  <text x="30" y="328" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Remember what this key is for</text>
  <!-- Save FAB -->
  <circle cx="200" cy="456" r="26" fill="#2563eb"/>
  <text x="200" y="462" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Save</text>
</svg>
