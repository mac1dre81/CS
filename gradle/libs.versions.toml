[versions]
agp = "8.5.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
composeBom = "2024.08.00"
room = "2.6.1"
security = "1.1.0"
okhttp = "4.12.0"
coroutines = "1.8.1"
lifecycle = "2.8.6"
activity = "1.9.2"
coreKtx = "1.13.1"
navigation = "2.8.0"
datastore = "1.1.1"
serialization = "1.7.1"
billing = "7.0.0"
biometric = "1.2.0-alpha04"
# AdMob: 23.6.0 is the latest release built with Kotlin <=2.0.x, so it is
# readable by this project's Kotlin 2.0.21 compiler. (25.x is built with
# Kotlin 2.3.0 metadata and fails with "binary version 2.3.0, expected 2.0.0".)
ads = "23.6.0"
material = "1.12.0"
desugar = "2.1.2"
leakcanary = "2.14"

# Firebase / Google Play Services
firebaseBom = "33.8.0"
googleServices = "4.4.2"
firebaseCrashlyticsGradle = "3.0.2"

# Test
junit = "4.13.2"
mockk = "1.13.12"
coroutinesTest = "1.8.1"
truth = "1.4.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
# Material Components provides the Material3 View-system theme (Theme.Material3.DayNight.NoActionBar)
# and the colorPrimary/colorOnPrimary attrs referenced by res/values/themes.xml. The Compose
# material3 AAR (material3-android) ships Compose composables only, not these View styles/attrs.
material = { module = "com.google.android.material:material", version.ref = "material" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
coreLibraryDesugaring = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
google-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "ads" }

# Firebase (Crashlytics crash reporting — see app/google-services.json, NOT in VCS)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics-ktx = { module = "com.google.firebase:firebase-crashlytics-ktx" }

# Test dependencies
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
