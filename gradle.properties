android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
# Enable R8 full mode for release builds (more aggressive shrinking + obfuscation).
# Set via gradle.properties because the Kotlin DSL property is not available
# in AGP 8.5.2. Only affects release builds; debug keeps R8 compat mode.
android.enableR8.fullMode=true
